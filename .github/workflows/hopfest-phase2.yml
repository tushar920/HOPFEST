name: HOP FEST Phase 2
on:
  push:
    paths:
      - '.github/workflows/hopfest-phase2.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Wire Phase 2
        run: |
          sed -i 's#</head>#<link rel="stylesheet" href="assets/css/phase2.css"></head>#' index.html
          sed -i 's#</script>\n</body>#</script><script src="assets/js/phase2.js"></script>\n</body>#' index.html
          sed -i 's#<div class="mpg-grid">#<div class="mpg-grid p2-stagger">#' index.html
          sed -i 's#<div class="exp-zones">#<div class="exp-zones p2-stagger">#' index.html
          sed -i 's#<div class="date-grid">#<div class="date-grid p2-stagger">#' index.html
          sed -i 's#</p><div style="margin-top:30px"><a class="btn btn-yellow" href="#tickets">Join the Challenge#</p><div class="hop-dash" aria-label="Interactive HOP Dash"><div class="hop-dash-head"><div class="hop-dash-title">HOP DASH — BEAT THE CLOCK</div><div class="hop-dash-score" id="hopDashScore">0 / 10 HOPS</div></div><div class="hop-dash-track"><div class="hop-runner" id="hopRunner" aria-hidden="true"></div></div><div class="hop-dash-actions"><button class="hop-dash-btn" id="hopDashBtn" type="button">HOP! →</button><span class="hop-dash-status" id="hopDashStatus">Tap HOP to start.</span></div></div><div style="margin-top:30px"><a class="btn btn-yellow" href="#tickets">Join the Challenge#' index.html
      - name: Commit and clean up
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Execute HOP FEST Phase 2 [hopphase2]' || true
          rm .github/workflows/hopfest-phase2.yml
          git add .github/workflows/hopfest-phase2.yml
          git commit -m 'Remove temporary Phase 2 workflow [hopphase2]' || true
          git push
