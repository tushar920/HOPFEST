name: HOP FEST Phase 2.5
on:
  push:
    paths:
      - '.github/workflows/hopfest-phase25.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Apply typography layer
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          font = '<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700;800&family=Bowlby+One+SC&family=Patrick+Hand&display=swap" rel="stylesheet">'
          css = '<link rel="stylesheet" href="assets/css/phase2-5.css">'
          if 'family=Bowlby+One+SC' not in s:
              marker = '<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">'
              if marker in s:
                  s = s.replace(marker, font, 1)
          if 'assets/css/phase2-5.css' not in s:
              s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply HOP FEST Phase 2.5 typography [hoptype]' || true
          git push
      - name: Remove temporary workflow
        run: |
          git rm .github/workflows/hopfest-phase25.yml
          git commit -m 'Remove temporary Phase 2.5 workflow [hoptype]'
          git push
