name: HOP FEST Logo Size
on:
  push:
    paths:
      - '.github/workflows/hopfest-logo-size.yml'
jobs:
  apply:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Increase logo scale
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('.nav{height:78px;', '.nav{height:88px;')
          s=s.replace('.brand img{width:116px;height:43px;', '.brand img{width:160px;height:60px;')
          s=s.replace('.foot-brand img{width:130px}', '.foot-brand img{width:165px}')
          s=s.replace('.brand img{width:95px}', '.brand img{width:125px}')
          s=s.replace('.nav{height:68px}', '.nav{height:76px}')
          p.write_text(s)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Increase HOP FEST logo size [hoplogo]' || true
          rm .github/workflows/hopfest-logo-size.yml
          git add .github/workflows/hopfest-logo-size.yml
          git commit -m 'Remove temporary logo sizing workflow [hoplogo]' || true
          git push
