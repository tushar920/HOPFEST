name: HOP FEST Logo
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hopfest-logo.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire official logo asset
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s2 = s.replace('assets/logo/hop-fest-logo.svg', 'assets/logo/hop-fest-logo-final.png')
          if s2 == s:
              raise SystemExit('No logo reference found to replace')
          p.write_text(s2)
          PY
      - name: Commit and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Use final HOP FEST logo asset [hoplogo]'
          git rm .github/workflows/hopfest-logo.yml
          git commit -m 'Remove temporary logo workflow [hoplogo]'
          git push
